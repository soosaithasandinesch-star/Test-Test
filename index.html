<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arithmetik R·01 — Taschenrechner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --case:#E7E1D1;
    --lcd:#212820;
    --lcd-ink:#D8E6CE;
    --lcd-dim:rgba(216,230,206,.42);
    --lcd-err:#F08A62;
    --num:#37342D;   --num-well:#201E18;  --num-ink:#EFE9D9;
    --util:#48443A;  --util-well:#2B2820; --util-ink:#CFC8B4;
    --op:#C6552C;    --op-well:#8C3817;   --op-ink:#F7E9DC;
    --eq:#DE6231;    --eq-well:#A03F17;   --eq-ink:#FFF2E7;
    --brand:#4B4233; --brand-dim:#8A7E66;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body{
    margin:0;
    min-height:100svh;
    background:#242019;
    display:grid;
    place-items:center;
    padding:36px 16px;
    font-family:'Space Grotesk',sans-serif;
  }

  /* Feine Papierkörnung im Hintergrund */
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  }

  .stage{ display:flex; flex-direction:column; align-items:center; }

  /* ————— Das Gehäuse ————— */
  .device{
    width:min(360px,100%);
    background:var(--case);
    border-radius:26px;
    padding:22px 20px 18px;
    box-shadow:
      0 0 0 1px rgba(0,0,0,.25),
      0 40px 80px -24px rgba(0,0,0,.7),
      0 12px 24px -12px rgba(0,0,0,.5),
      inset 0 1.5px 0 rgba(255,255,255,.6),
      inset 0 -3px 0 rgba(0,0,0,.06);
  }

  /* ————— Kopfzeile ————— */
  .head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; }
  .brand-name{ display:block; font-weight:700; font-size:15px; letter-spacing:.24em; color:var(--brand); }
  .brand-sub{ display:block; margin-top:4px; font-weight:500; font-size:9px; letter-spacing:.18em; color:var(--brand-dim); }
  .head-right{ display:flex; align-items:center; gap:14px; }

  /* Dekorative Solarzelle */
  .solar{ display:flex; gap:3px; padding:3px; background:#191713; border-radius:4px;
          box-shadow:inset 0 1px 4px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.4); }
  .solar i{ width:9px; height:16px; border-radius:1px; background:#2C3126; }
  .solar i:nth-child(2){ background:#323729; }
  .solar i:nth-child(3){ background:#2A2F25; }
  .solar i:nth-child(4){ background:#343A2B; }

  /* Klang-Schalter */
  .sound{ display:flex; align-items:center; gap:7px; cursor:pointer; user-select:none; }
  .sound span{ font-weight:700; font-size:9px; letter-spacing:.16em; color:var(--brand-dim); }
  .sound input{ display:none; }
  .sw{ width:30px; height:16px; border-radius:99px; background:#CFC8B4; position:relative;
       box-shadow:inset 0 1px 3px rgba(0,0,0,.28); transition:background .15s; }
  .sw::after{ content:""; position:absolute; top:2px; left:2px; width:12px; height:12px; border-radius:50%;
              background:#F4EFE1; box-shadow:0 1px 2px rgba(0,0,0,.35); transition:transform .15s; }
  .sound input:checked + .sw{ background:var(--op); }
  .sound input:checked + .sw::after{ transform:translateX(14px); }

  /* ————— Display ————— */
  .display{ background:#DCD5C2; border-radius:16px; padding:12px;
            box-shadow:inset 0 2px 5px rgba(0,0,0,.14), inset 0 -1px 0 rgba(255,255,255,.55); }
  .screen{ background:var(--lcd); border-radius:9px; padding:10px 16px 12px; overflow:hidden;
           box-shadow:inset 0 3px 10px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.3); }
  .expr{ height:18px; font:400 13px 'Space Mono',monospace; color:var(--lcd-dim);
         text-align:right; white-space:nowrap; }
  .readout{ position:relative; display:flex; justify-content:flex-end; margin-top:2px;
            font-size:40px; line-height:54px; }
  .screen.long   .readout{ font-size:31px; }
  .screen.xlong  .readout{ font-size:23px; }
  .ghost, .value{ font:700 1em 'Space Mono',monospace; letter-spacing:.02em; }
  .ghost{ position:absolute; right:0; top:0; bottom:0; display:flex; align-items:center;
          color:rgba(216,230,206,.08); pointer-events:none; }
  .value{ position:relative; color:var(--lcd-ink); background:var(--lcd); }
  .screen.err .value{ color:var(--lcd-err); }
  .value.flash{ animation:flash .35s ease-out; }
  @keyframes flash{ 0%{ color:#F6FFEC; } 100%{ color:var(--lcd-ink); } }
  .screen.shake{ animation:shake .28s; }
  @keyframes shake{ 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-4px); } 75%{ transform:translateX(4px); } }

  /* ————— Tasten ————— */
  .keys{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:18px; }
  .key{
    height:58px; border:0; border-radius:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    background:var(--num); color:var(--num-ink);
    box-shadow:0 4px 0 var(--num-well), 0 7px 12px rgba(0,0,0,.22);
    transform:translateY(0);
    transition:transform .06s ease, box-shadow .06s ease, filter .12s ease;
  }
  .key:hover{ filter:brightness(1.07); }
  .key:active, .key.pressed{
    transform:translateY(3px);
    box-shadow:0 1px 0 var(--num-well), 0 2px 5px rgba(0,0,0,.18);
  }
  .key:focus-visible{ outline:2px solid var(--eq); outline-offset:2px; }

  .num { font:700 21px 'Space Mono',monospace; }
  .util{ background:var(--util); color:var(--util-ink);
         box-shadow:0 4px 0 var(--util-well), 0 7px 12px rgba(0,0,0,.22); font:700 17px 'Space Mono',monospace; }
  .util:active, .util.pressed{ box-shadow:0 1px 0 var(--util-well), 0 2px 5px rgba(0,0,0,.18); }
  .util.danger{ color:var(--eq); }

  .op{ background:var(--op); color:var(--op-ink); font:400 26px 'Space Mono',monospace;
       box-shadow:0 4px 0 var(--op-well), 0 7px 12px rgba(0,0,0,.22); }
  .op:active, .op.pressed{ box-shadow:0 1px 0 var(--op-well), 0 2px 5px rgba(0,0,0,.18); }

  .eq{ background:var(--eq); color:var(--eq-ink); font:400 27px 'Space Mono',monospace;
       box-shadow:0 4px 0 var(--eq-well), 0 7px 12px rgba(0,0,0,.22); }
  .eq:active, .eq.pressed{ box-shadow:0 1px 0 var(--eq-well), 0 2px 5px rgba(0,0,0,.18); }

  .foot{ margin-top:16px; text-align:center; font-weight:500; font-size:8.5px;
         letter-spacing:.24em; color:#A79B82; }

  .hint{ margin-top:22px; font-weight:500; font-size:10px; letter-spacing:.16em;
         color:#7E7666; text-align:center; }

  @media (max-width:400px){
    .device{ padding:16px 14px 14px; }
    .keys{ gap:8px; }
    .key{ height:52px; }
  }
</style>
</head>
<body>

<main class="stage">
  <section class="device" aria-label="Taschenrechner">

    <header class="head">
      <div class="brand">
        <span class="brand-name">ARITHMETIK</span>
        <span class="brand-sub">MOD. R·01 · ZEHN STELLEN</span>
      </div>
      <div class="head-right">
        <div class="solar" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <label class="sound" title="Tastenton ein/aus">
          <span>KLANG</span>
          <input type="checkbox" id="soundSwitch" checked>
          <i class="sw"></i>
        </label>
      </div>
    </header>

    <section class="display">
      <div class="screen" id="screen">
        <div class="expr" id="expr">&nbsp;</div>
        <div class="readout">
          <div class="ghost" aria-hidden="true">00000000000000</div>
          <div class="value" id="value" aria-live="polite">0</div>
        </div>
      </div>
    </section>

    <section class="keys" id="keys">
      <button class="key util danger" data-action="clear">C</button>
      <button class="key util" data-action="sign">±</button>
      <button class="key util" data-action="percent">%</button>
      <button class="key op" data-action="operator" data-op="÷">÷</button>

      <button class="key num" data-digit="7">7</button>
      <button class="key num" data-digit="8">8</button>
      <button class="key num" data-digit="9">9</button>
      <button class="key op" data-action="operator" data-op="×">×</button>

      <button class="key num" data-digit="4">4</button>
      <button class="key num" data-digit="5">5</button>
      <button class="key num" data-digit="6">6</button>
      <button class="key op" data-action="operator" data-op="−">−</button>

      <button class="key num" data-digit="1">1</button>
      <button class="key num" data-digit="2">2</button>
      <button class="key num" data-digit="3">3</button>
      <button class="key op" data-action="operator" data-op="+">+</button>

      <button class="key num" data-digit="0">0</button>
      <button class="key num" data-action="dot">,</button>
      <button class="key util" data-action="backspace" aria-label="Rücktaste">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 4H8l-5 8 5 8h13a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1z"/>
          <line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/>
        </svg>
      </button>
      <button class="key eq" data-action="equals">=</button>
    </section>

    <footer class="foot">KETTENRECHNUNG · SIGNALTON · VORZEICHENWECHSEL</footer>
  </section>

  <p class="hint">TASTATUR&ensp;·&ensp;0–9&ensp;,&ensp;+ − × ÷&ensp;·&ensp;ENTER =&ensp;·&ensp;ESC C&ensp;·&ensp;RÜCKTASTE LÖSCHT</p>
</main>

<script>
(function(){
  'use strict';

  // ————— Zustand —————
  let cur   = '0';    // aktuelle Eingabe als String (intern mit Punkt)
  let acc   = null;   // gespeicherter erster Operand
  let op    = null;   // gespeicherter Operator
  let fresh = true;   // nächste Ziffer ersetzt die Anzeige
  let error = false;
  let expr  = '';     // kleine Rechnungs-Vorschau

  // ————— DOM —————
  const valueEl = document.getElementById('value');
  const exprEl  = document.getElementById('expr');
  const screenEl= document.getElementById('screen');
  const keysEl  = document.getElementById('keys');

  // ————— Klang (Web Audio, kein externes Asset) —————
  let actx = null, soundOn = true;
  function ensureAudio(){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!actx && AC) actx = new AC();
    if (actx && actx.state === 'suspended') actx.resume();
  }
  function tone(f, d, type, v){
    const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(v || .06, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + d + .02);
  }
  function beep(kind){
    if (!soundOn) return;
    ensureAudio();
    if (!actx) return;
    if      (kind === 'eq')  { tone(1250,.05); setTimeout(function(){ tone(950,.07); }, 55); }
    else if (kind === 'op')    tone(1050,.045);
    else if (kind === 'err')   tone(300,.2,'sawtooth',.07);
    else                       tone(1500,.035);
  }

  document.getElementById('soundSwitch').addEventListener('change', function(){
    soundOn = this.checked;
    if (soundOn){ ensureAudio(); if (actx) tone(1300,.04); }
  });

  // ————— Zahlen-Formatierung —————
  function numToStr(n){                       // Zahl → String, Float-Artefakte entfernen
    n = parseFloat(n.toPrecision(12));
    if (Math.abs(n) >= 1e12 || (n !== 0 && Math.abs(n) < 1e-9))
      return n.toExponential(6).replace('.', ',').replace('e', 'E');
    return String(n);
  }
  function pretty(s){                         // deutsche Anzeige: 1.234.567,89
    if (s.includes('E') || s === 'FEHLER') return s;
    let neg = s.startsWith('-'); if (neg) s = s.slice(1);
    let p = s.split('.'), i = p[0], f = p[1];
    i = i.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return (neg ? '-' : '') + i + (f !== undefined ? ',' + f : '');
  }

  // ————— Anzeige —————
  function render(){
    const t = error ? 'FEHLER' : pretty(cur);
    valueEl.textContent = t;
    screenEl.classList.toggle('long',  t.length > 9  && t.length <= 12);
    screenEl.classList.toggle('xlong', t.length > 12);
    exprEl.textContent = expr || '\u00A0';
  }
  function flashResult(){
    valueEl.classList.remove('flash'); void valueEl.offsetWidth;
    valueEl.classList.add('flash');
  }

  // ————— Rechen-Kern —————
  function calc(a, o, b){
    if (o === '+') return a + b;
    if (o === '−') return a - b;
    if (o === '×') return a * b;
    if (o === '÷') return b === 0 ? NaN : a / b;
    return b;
  }
  function showError(){
    error = true; cur = 'FEHLER'; acc = null; op = null; fresh = true; expr = '';
    screenEl.classList.add('err');
    screenEl.classList.remove('shake'); void screenEl.offsetWidth;
    screenEl.classList.add('shake');
    beep('err'); render();
  }
  function clearAll(){
    beep('key');
    cur = '0'; acc = null; op = null; fresh = true; error = false; expr = '';
    screenEl.classList.remove('err');
    render();
  }

  // ————— Eingaben —————
  function digit(d){
    beep('key');
    if (error){ cur = '0'; acc = null; op = null; error = false; expr = ''; screenEl.classList.remove('err'); }
    if (fresh){ cur = d; fresh = false; }
    else if (cur.replace(/[^0-9]/g,'').length < 12){
      cur = (cur === '0') ? d : cur + d;
    }
    render();
  }
  function dot(){
    beep('key');
    if (error){ clearAll(); }
    if (fresh){ cur = '0.'; fresh = false; }
    else if (!cur.includes('.')) cur += '.';
    render();
  }
  function sign(){
    if (error) return;
    beep('op');
    if (cur !== '0') cur = cur.startsWith('-') ? cur.slice(1) : '-' + cur;
    render();
  }
  function percent(){
    if (error) return;
    beep('op');
    cur = numToStr(parseFloat(cur) / 100);
    fresh = false; render();
  }
  function backspace(){
    if (error || fresh){ if (error) clearAll(); return; }
    beep('key');
    if (cur.length === 1 || (cur.length === 2 && cur.startsWith('-'))) cur = '0';
    else cur = cur.slice(0, -1);
    render();
  }
  function setOp(o){
    if (error) return;
    if (op !== null && !fresh){
      const r = calc(acc, op, parseFloat(cur));
      if (!isFinite(r)){ showError(); return; }
      acc = parseFloat(numToStr(r));
      cur = numToStr(r);
    } else if (acc === null || op === null){
      acc = parseFloat(cur);
    }
    op = o; fresh = true;
    expr = pretty(numToStr(acc)) + ' ' + o;
    beep('op'); render();
  }
  function equals(){
    if (error) return;
    if (op === null || acc === null){ beep('key'); return; }
    beep('eq');
    const a = acc, b = parseFloat(cur);
    const r = calc(a, op, b);
    expr = pretty(numToStr(a)) + ' ' + op + ' ' + pretty(numToStr(b)) + ' =';
    if (!isFinite(r)){ showError(); return; }
    cur = numToStr(r); acc = null; op = null; fresh = true;
    flashResult(); render();
  }

  // ————— Klick auf Tasten —————
  keysEl.addEventListener('click', function(e){
    const b = e.target.closest('.key'); if (!b) return;
    if (b.dataset.digit !== undefined){ digit(b.dataset.digit); return; }
    switch (b.dataset.action){
      case 'dot':       dot();        break;
      case 'clear':     clearAll();   break;
      case 'sign':      sign();       break;
      case 'percent':   percent();    break;
      case 'backspace': backspace();  break;
      case 'operator':  setOp(b.dataset.op); break;
      case 'equals':    equals();     break;
    }
  });

  // ————— Tastatur-Bedienung (mit sichtbarem Tastendruck) —————
  const q = function(s){ return keysEl.querySelector(s); };
  const numBtns = {}, opBtns = {};
  keysEl.querySelectorAll('[data-digit]').forEach(function(b){ numBtns[b.dataset.digit] = b; });
  keysEl.querySelectorAll('[data-op]').forEach(function(b){ opBtns[b.dataset.op] = b; });
  const B = {
    dot: q('[data-action="dot"]'),   clear: q('[data-action="clear"]'),
    sign: q('[data-action="sign"]'), pct: q('[data-action="percent"]'),
    bs: q('[data-action="backspace"]'), eq: q('[data-action="equals"]')
  };
  function press(btn){
    if (!btn) return;
    btn.classList.add('pressed');
    clearTimeout(btn._t);
    btn._t = setTimeout(function(){ btn.classList.remove('pressed'); }, 120);
  }

  window.addEventListener('keydown', function(e){
    const k = e.key;
    if (k >= '0' && k <= '9'){ e.preventDefault(); digit(k); press(numBtns[k]); }
    else if (k === ',' || k === '.'){ e.preventDefault(); dot(); press(B.dot); }
    else if (k === '+'){ e.preventDefault(); setOp('+'); press(opBtns['+']); }
    else if (k === '-'){ e.preventDefault(); setOp('−'); press(opBtns['−']); }
    else if (k === '*' || k.toLowerCase() === 'x'){ e.preventDefault(); setOp('×'); press(opBtns['×']); }
    else if (k === '/'){ e.preventDefault(); setOp('÷'); press(opBtns['÷']); }
    else if (k === 'Enter' || k === '='){ e.preventDefault(); equals(); press(B.eq); }
    else if (k === 'Escape'){ e.preventDefault(); clearAll(); press(B.clear); }
    else if (k === 'Backspace'){ backspace(); press(B.bs); }
    else if (k === '%'){ e.preventDefault(); percent(); press(B.pct); }
  });

  render();
})();
</script>
</body>
</html>
